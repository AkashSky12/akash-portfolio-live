        - paragraph [ref=e222]: I'm a QA Lead & GenAI Automation Engineer with nearly 10 years across manual and automation testing for web and mobile applications.
        - paragraph [ref=e223]: I specialize in end-to-end UI testing, API and contract testing, test planning, requirements elicitation, and full test-cycle ownership within Agile delivery. I own end-to-end test architecture using Playwright (Python) and Selenium (Java), and integrate AI-augmented and GenAI workflows to modernize quality practices in high-growth, high-stakes environments.
        - paragraph [ref=e224]: I've delivered quality programs across blockchain healthcare, enterprise software, and food-tech — with hands-on strength in defect management, independent verification, and shift-left quality strategy. Recognized with a Siemens client appreciation award and three internal excellence awards.
        - paragraph [ref=e225]: I'm now open to senior QA architect, automation lead, or AI-augmented testing roles at companies where quality engineering drives product velocity.
