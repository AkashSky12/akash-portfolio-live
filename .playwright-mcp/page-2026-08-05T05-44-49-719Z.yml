        - paragraph [ref=e217]: Who I Am
        - heading "Quality as a competitive advantage." [level=2] [ref=e218]
        - paragraph [ref=e219]: I don't just find bugs — I architect systems that prevent them, and now I build AI agents that redefine how testing happens.
