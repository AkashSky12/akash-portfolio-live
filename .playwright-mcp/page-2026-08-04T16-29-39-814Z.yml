            - generic [ref=f5e75]: · Kuala Lumpur, Malaysia
          - paragraph [ref=f5e76]: E-Commerce · Retail Tech
          - list [ref=f5e77]:
            - listitem [ref=f5e78]:
              - strong [ref=f5e80]: Pioneered GenAI-powered QA agent infrastructure from zero
              - text: — built custom agents for test case generation, synthetic data creation, and exploratory workflows; reduced manual test authoring effort by ~40% per sprint.
            - listitem [ref=f5e81]:
              - strong [ref=f5e83]: Engineered accessibility automation with Axe-core in Playwright
              - text: — enforced WCAG 2.1 AA across European web properties and surfaced accessibility violations directly in CI as first-class defects.
            - listitem [ref=f5e84]:
              - strong [ref=f5e86]: Built and maintained GitHub Actions CI/CD pipelines
              - text: to trigger automated test suites on pull requests and release branches, accelerating developer feedback and reducing manual execution overhead.
            - listitem [ref=f5e87]:
              - strong [ref=f5e89]: Led end-to-end AI-augmented quality strategy
              - text: as the primary automation engineer, defining quality gates, aligning QA milestones to business releases, and coordinating cross-functional product-engineering delivery.
            - listitem [ref=f5e90]:
              - strong [ref=f5e92]: Managed QA coordination and release quality for 12+ customer-facing platforms
              - text: across ANZ, APAC, and EU regions, ensuring consistent multi-region deployments and stable customer experience.
            - listitem [ref=f5e93]:
              - strong [ref=f5e95]: Established global Quality Systems documentation and compliance standards
              - text: and delivered executive-level QA reporting to senior program stakeholders across European markets.
            - listitem [ref=f5e96]:
              - strong [ref=f5e98]: Drove performance and operational quality improvements
              - text: by implementing Grafana K6 monitoring, strengthening production-readiness checks, and coaching teams on quality best practices.
        - listitem [ref=f5e99]:
          - generic [ref=f5e101]: Apr 2022 — Aug 2023
