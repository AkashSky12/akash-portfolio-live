        - paragraph [ref=f5e222]: Who I Am
        - heading "Quality as a competitive advantage." [level=2] [ref=f5e223]
        - paragraph [ref=f5e224]: I don't just find bugs — I architect systems that prevent them, and now I build AI agents that redefine how testing happens.
      - generic [ref=f5e225]:
        - generic [ref=f5e226]:
          - paragraph [ref=f5e227]: I'm a QA Lead & GenAI Automation Engineer with nearly 10 years across manual and automation testing for web and mobile applications.
          - paragraph [ref=f5e228]: I specialize in end-to-end UI testing, API and contract testing, test planning, requirements elicitation, and full test-cycle ownership within Agile delivery. I own end-to-end test architecture using Playwright (Python) and Selenium (Java), and integrate AI-augmented and GenAI workflows to modernize quality practices in high-growth, high-stakes environments.
          - paragraph [ref=f5e229]: I've delivered quality programs across blockchain healthcare, enterprise software, and food-tech — with hands-on strength in defect management, independent verification, and shift-left quality strategy. Recognized with a Siemens client appreciation award and three internal excellence awards.
          - paragraph [ref=f5e230]: I'm now open to senior QA architect, automation lead, or AI-augmented testing roles at companies where quality engineering drives product velocity.
